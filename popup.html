<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="glass-panel">
        <h1>Night Flash</h1>

        <div class="toggle-container">
            <span class="toggle-label">Global Switch</span>
            <label class="switch">
                <input type="checkbox" id="globalToggle" checked>
                <span class="slider"></span>
            </label>
        </div>
        <p class="subtitle">Site-specific controls available on page. (press ctrl+shift+f)</p>
        <div class="control-group">
            <span class="toggle-label">Torch Size</span>
            <div class="preset-group" id="sizePresets">
                <button data-size="100" class="preset-btn">Small</button>
                <button data-size="180" class="preset-btn active">Medium</button>
                <button data-size="300" class="preset-btn">Large</button>
            </div>
        </div>
        <div class="control-group">
            <span class="toggle-label">Torch Temperature</span>
            <div class="preset-group" id="tempPresets">
                <button data-temp="100,200,255" class="preset-btn">Cool</button>
                <button data-temp="255,255,255" class="preset-btn">Neutral</button>
                <button data-temp="255,179,71" class="preset-btn active">Warm</button>
            </div>
        </div>
        <div class="control-group">
            <span class="toggle-label">Number of firefly</span>
            <label for="fireflySlider">Firefly count: <span id="fireflyCountValue">40</span></label>
            <input type="range" id="fireflySlider" min="0" max="200" value="40" step="10">
        </div>
        <div class="control-group">
            <span class="toggle-label">Sleep Time</span>
            <label for="sleepTimerDropdown">time: </label>
            <select id="sleepTimerDropdown">
                <option value="30000">30 Sec</option>
                <option value="60000">1 Min</option>
                <option value="120000" selected>2 Min</option>
                <option value="300000">5 Min</option>
                <option value="never">Never sleep(like me)</option>
            </select>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
